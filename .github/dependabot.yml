version: 2
updates:
    - package-ecosystem: npm
      directory: frontend
      schedule:
          interval: weekly
    - package-ecosystem: pip
      directories: [backend, functional-tests]
      schedule:
          interval: daily
    - package-ecosystem: docker-compose
      directory: /
      schedule:
          interval: daily
    - package-ecosystem: docker
      directories: [frontend, backend]
      schedule:
          interval: daily
    - package-ecosystem: github-actions
      directory: .github
      schedule:
          interval: daily
